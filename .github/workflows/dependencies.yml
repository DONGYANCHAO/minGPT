name: Update Dependencies

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-deps:
    name: Update Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools

      - name: Check for outdated dependencies
        run: |
          pip install -e ".[dev]"
          pip list --outdated --format=freeze > outdated.txt || true
          cat outdated.txt || echo "All dependencies are up to date"

      - name: Create Issue if Outdated
        if: hashFiles('outdated.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outdated = fs.readFileSync('outdated.txt', 'utf8');
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Weekly Dependency Update Check',
              body: `## Outdated Dependencies\n\nThe following dependencies are outdated:\n\n\`\`\`\n${outdated}\n\`\`\`\n\nPlease review and update as needed.`,
              labels: ['dependencies', 'maintenance']
            });
            
            console.log(`Created issue #${issue.data.number}`);
