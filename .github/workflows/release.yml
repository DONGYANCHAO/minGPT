# minGPT PyPI 自动发布工作流
# 当推送 Git 标签时自动构建并发布到 PyPI

name: Release

on:
  # 触发条件：推送标签（格式：v*）
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

  # 允许手动触发（用于预发布测试）
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - production

# 权限配置
permissions:
  contents: write  # 需要写入权限来创建 Release
  id-token: write  # 用于 OIDC 发布到 PyPI (trusted publishing)

jobs:
  # ==================== 测试阶段 ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-release-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Run tests
        run: |
          pytest -v --tb=short

  # ==================== 构建阶段 ====================
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史用于 setuptools-scm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents

      - name: Build package
        run: |
          python -m build

      - name: Check package with twine
        run: |
          twine check dist/*

      - name: Check wheel contents
        run: |
          check-wheel-contents dist/*.whl

      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c "import setuptools_scm; print(setuptools_scm.get_version())")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

    outputs:
      version: ${{ steps.get_version.outputs.version }}

  # ==================== TestPyPI 预发布 ====================
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mingpt

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

      - name: Test installation from TestPyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple mingpt==${{ needs.build.outputs.version }} || true

  # ==================== PyPI 正式发布 ====================
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, publish-testpypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/mingpt

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          print-hash: true

  # ==================== 创建 GitHub Release ====================
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        id: generate_notes
        run: |
          # 提取标签版本号
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # 从 CHANGELOG.md 提取当前版本的更新日志
          if [ -f CHANGELOG.md ]; then
            # 尝试提取当前版本的内容
            NOTES=$(awk "/^## \[$TAG\]/,/^## \[/" CHANGELOG.md | head -n -1)
            if [ -z "$NOTES" ]; then
              NOTES="Release $TAG"
            fi
          else
            NOTES="Release $TAG"
          fi

          # 保存到文件
          echo "$NOTES" > release_notes.md
          echo "Release notes generated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.generate_notes.outputs.tag }}
          body_path: release_notes.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(steps.generate_notes.outputs.tag, 'a') || contains(steps.generate_notes.outputs.tag, 'b') || contains(steps.generate_notes.outputs.tag, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 更新 CHANGELOG ====================
  update-changelog:
    name: Update CHANGELOG
    runs-on: ubuntu-latest
    needs: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CHANGELOG
        uses: github-changelog-generator/github-changelog-generator@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: CHANGELOG.md
          issues: true
          issuesWoLabels: true
          pullRequests: true
          prWoLabels: true
          author: true
          unreleased: true
          compareLink: true
          verbose: true

      - name: Commit CHANGELOG
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "Update CHANGELOG.md [skip ci]"
          git push || true

  # ==================== 通知 ====================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [publish-pypi, github-release]
    if: always()

    steps:
      - name: Release Success Notification
        if: needs.publish-pypi.result == 'success' && needs.github-release.result == 'success'
        run: |
          echo "✅ Release completed successfully!"
          echo "📦 Package published to PyPI"
          echo "📝 GitHub Release created"

      - name: Release Failure Notification
        if: failure()
        run: |
          echo "❌ Release failed!"
          echo "Please check the workflow logs for details."
