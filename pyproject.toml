[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minGPT"
authors = [
  { name="Andrej Karpathy", email="karpathy@cs.stanford.edu" }
]
description = "A PyTorch re-implementation of GPT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["gpt", "transformer", "pytorch", "deep-learning", "language-model"]
dependencies = [
    "torch>=1.10.0",
]
version = "0.0.1"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "nbqa>=1.8",
    "jupyter>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/karpathy/minGPT"
Repository = "https://github.com/karpathy/minGPT"
Documentation = "https://github.com/karpathy/minGPT/blob/master/README.md"
Issues = "https://github.com/karpathy/minGPT/issues"

[tool.setuptools]
packages = ["mingpt"]

[tool.setuptools_scm]
write_to = "mingpt/_version.py"
write_to_template = "__version__ = version = '{version}'\n__version_tuple__ = version_tuple = {version_tuple}\n"
version_scheme = "release-branch-semver"
local_scheme = "node-and-date"
fallback_version = "0.0.1"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
  "E", "F", "I", "B", "C4", "SIM",
]
ignore = []
fix = true
fixable = ["ALL"]
unfixable = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
disallow_untyped_defs = false
strict = false
show_error_codes = true
exclude = [
    '^setup\.py$',
]
