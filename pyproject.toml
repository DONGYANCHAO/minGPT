# minGPT - 一个 PyTorch 实现的 GPT 模型
# 现代 Python 项目配置 (PEP 517/518/621)

[build-system]
# 构建系统要求
requires = [
    "setuptools>=61.0",      # 支持 PEP 621 的 setuptools
    "setuptools-scm>=7.0",   # 基于 Git 标签的自动版本管理
    "wheel>=0.37.0",         # wheel 构建支持
]
build-backend = "setuptools.build_meta"

# ==================== 项目元数据 ====================
[project]
name = "mingpt"
# 动态版本管理 (由 setuptools-scm 从 Git 标签自动生成)
dynamic = ["version"]

description = "A PyTorch re-implementation of GPT, small, clean, interpretable and educational"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

# 作者信息
authors = [
    {name = "Andrej Karpathy", email = "andrej.karpathy@gmail.com"},
]

# 维护者信息
maintainers = [
    {name = "minGPT Contributors"},
]

# 关键词和分类器
keywords = [
    "deep-learning",
    "pytorch",
    "gpt",
    "transformer",
    "nlp",
    "language-model",
    "machine-learning",
    "ai",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# 项目依赖
dependencies = [
    "torch>=1.9.0",
    "numpy>=1.20.0",
    "tqdm>=4.60.0",
]

# 可选依赖 (extras)
[project.optional-dependencies]
# 开发依赖
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "bandit[toml]>=1.7.0",
    "nbstripout>=0.6.0",
    "nbqa>=1.7.0",
    "autoflake>=2.0.0",
    "pyupgrade>=3.0.0",
]

# 文档依赖
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.20.0",
    "myst-parser>=1.0.0",
]

# 测试依赖
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.0.0",
]

# 所有可选依赖
all = [
    "mingpt[dev,docs,test]",
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
    "tensorboard>=2.10.0",
    "wandb>=0.13.0",
]

# 项目链接
[project.urls]
Homepage = "https://github.com/karpathy/minGPT"
Documentation = "https://github.com/karpathy/minGPT#readme"
Repository = "https://github.com/karpathy/minGPT.git"
Issues = "https://github.com/karpathy/minGPT/issues"
Changelog = "https://github.com/karpathy/minGPT/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/karpathy/minGPT/issues"
"Source Code" = "https://github.com/karpathy/minGPT"

# 入口点
[project.scripts]
# 命令行工具（如有需要）
# mingpt-train = "mingpt.cli:main"

# ==================== Setuptools 配置 ====================
[tool.setuptools]
# 包发现
packages = ["mingpt"]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
mingpt = ["py.typed"]

# ==================== Setuptools-SCM 配置 ====================
[tool.setuptools-scm]
# 版本格式: {tag}.dev{distance}+{scm letter}{revision hash}
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"
write-to = "mingpt/_version.py"
write-to-template = '''
# 由 setuptools-scm 自动生成，请勿手动修改
__version__ = "{version}"
__version_tuple__ = {version_tuple}
'''

# ==================== Black 配置 ====================
[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # 目录
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
  | \.pytest_cache
  | htmlcov
  | \.coverage
)/
'''
skip-string-normalization = false
preview = true

# ==================== isort 配置 ====================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".git", "__pycache__", ".venv", "venv", "build", "dist"]
known_first_party = ["mingpt"]
known_third_party = ["torch", "numpy", "tqdm"]

# ==================== Ruff 配置 ====================
[tool.ruff]
line-length = 100
target-version = "py38"

# 启用规则
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "C90",  # mccabe complexity
]

# 忽略规则
ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "E501",  # Line too long (handled by black)
    "S101",  # Use of assert detected
]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.mccabe]
max-complexity = 15

[tool.ruff.per-file-ignores]
# 测试文件特殊规则
"tests/*" = ["S", "D"]
"projects/*" = ["S", "D"]
"scripts/*" = ["S", "D"]

# ==================== MyPy 配置 ====================
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true

# 排除路径
exclude = [
    "tests/",
    "projects/",
    "scripts/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tqdm.*"
ignore_missing_imports = true

# ==================== Bandit 配置 ====================
[tool.bandit]
exclude_dirs = ["tests", "projects", "scripts"]
skips = ["B101", "B311"]  # assert 和 random 使用

# ==================== Pytest 配置 ====================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=mingpt",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=50",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ==================== Coverage 配置 ====================
[tool.coverage.run]
source = ["mingpt"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "mingpt/_version.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ==================== Pre-commit CI 配置 ====================
[tool.pre-commit.ci]
autofix_prs = true
autoupdate_branch = ""
autoupdate_commit_msg = "[pre-commit.ci] pre-commit autoupdate"
autoupdate_schedule = "weekly"
skip = []
submodules = false
